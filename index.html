<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Veda - Premium Astrology</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                brand: {
                    bg: '#020420',
                    card: 'rgba(15, 23, 42, 0.7)',
                    border: 'rgba(255, 255, 255, 0.1)',
                    purple: '#a855f7',
                    blue: '#3b82f6',
                    accent: '#facc15'
                }
            }
        }
    }
}
</script>
<style>
body { background-color: #020420; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; margin: 0; }
.glass { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }

/* NEON GLOW EFFECTS */
.glow-text-purple {
    background: linear-gradient(to bottom, #fff, #c084fc);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(192, 132, 252, 0.6));
}

.glow-text-blue {
    background: linear-gradient(to bottom, #fff, #60a5fa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 15px rgba(96, 165, 250, 0.6));
}

.neon-border-glow {
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
    border: 1px solid rgba(168, 85, 247, 0.4);
}

/* Background Video */
.video-bg-container { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
.video-bg-container video { width: 100%; height: 100%; object-fit: cover; opacity: 0.5; }
.video-overlay { position: absolute; inset: 0; background: radial-gradient(circle, transparent 20%, #020420 100%); }

@keyframes slideUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
.slide-up { animation: slideUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

.file-upload-btn { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; font-weight: 600; cursor: pointer; transition: 0.3s; }
.file-upload-btn:hover { border-color: #a855f7; background: #1e293b; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, memo } = React;
emailjs.init("8r2tapCdRmVdIbFQb"); 

const Background = memo(() => (
    <div className="video-bg-container">
        <video autoPlay muted loop playsInline>
            <source src="Untitled design (2).mp4" type="video/mp4" />
        </video>
        <div className="video-overlay"></div>
    </div>
));

function App() {
    const [view, setView] = useState('client');
    const [isBooking, setIsBooking] = useState(false);
    const [step, setStep] = useState(1);
    const [email, setEmail] = useState('');
    const [phone, setPhone] = useState('');
    const [date, setDate] = useState('');
    const [txid, setTxid] = useState('');
    const [fileName, setFileName] = useState('Click to upload screenshot');
    const [hasFile, setHasFile] = useState(false);
    const [otpSent, setOtpSent] = useState(false);
    const [generatedOtp, setGeneratedOtp] = useState('');
    const [userOtp, setUserOtp] = useState('');
    const [isSending, setIsSending] = useState(false);
    const [appointments, setAppointments] = useState([]);
    const [bookedDates, setBookedDates] = useState(['2026-04-25']);

    const handleSendOTP = async (e) => {
        e.preventDefault();
        setIsSending(true);
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        try {
            await emailjs.send("service_z2jyz5c", "template_hod7wir", { to_email: email, otp_code: code });
            setOtpSent(true);
        } catch (err) { alert("Verification error."); }
        setIsSending(false);
    };

    const finalizeBooking = () => {
        const newApp = { id: 'AV-' + Date.now().toString().slice(-4), email, phone, date, status: 'Pending', txid };
        setAppointments([newApp, ...appointments]);
        alert("Wait for the approval from the Astro Veda");
        setIsBooking(false); setStep(1);
    };

    return (
        <div className="min-h-screen flex flex-col">
            <Background />
            
            <nav className="flex justify-between items-center p-8 max-w-7xl mx-auto w-full z-20">
                <div className="cursor-pointer select-none" onDoubleClick={() => setView('admin')} onClick={() => setView('client')}>
                    <span className="text-3xl font-extrabold tracking-tighter glow-text-purple uppercase">ASTROVEDA</span>
                </div>
                <div className="flex gap-6 items-center">
                    <a href="#reviews" className="text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-white transition">Reviews</a>
                    <button onClick={() => setIsBooking(true)} className="px-6 py-2 bg-brand-purple rounded-full text-xs font-bold uppercase tracking-widest shadow-lg shadow-purple-500/20 active:scale-95 transition">Book Now</button>
                </div>
            </nav>

            {view === 'client' ? (
                <>
                    <main className="flex-grow flex flex-col items-center justify-center px-6 py-20 text-center z-10">
                        <div className="slide-up">
                            <div className="inline-block px-4 py-1 mb-6 rounded-full bg-white/5 border border-white/10 text-[10px] font-bold uppercase tracking-[0.3em] text-slate-300">
                                🪐 30+ Years of Ancient Wisdom
                            </div>
                            
                            <h1 className="text-6xl md:text-[8rem] font-black tracking-tighter mb-4 leading-none uppercase">
                                <span className="glow-text-blue">PRECISION</span><br/>
                                <span className="text-white">ASTROLOGY</span>
                            </h1>
                            
                            <p className="text-slate-400 text-lg max-w-xl mx-auto mb-12 font-medium leading-relaxed">
                                High-accuracy analysis using unique methods. <br/>
                                <span className="text-white">One exclusive session daily at 09:30 PM.</span>
                            </p>

                            <div className="max-w-sm mx-auto">
                                <div className="glass p-12 rounded-[3.5rem] neon-border-glow relative overflow-hidden group transition-all duration-700">
                                    <p className="text-slate-500 line-through font-bold text-sm mb-1">₹3,500</p>
                                    <h2 className="text-7xl font-black text-white mb-8 tracking-tighter italic">₹1,999</h2>
                                    <button onClick={() => setIsBooking(true)} className="w-full bg-white text-black font-black py-5 rounded-2xl hover:bg-brand-purple hover:text-white transition-all shadow-xl uppercase text-xs tracking-widest">
                                        Reserve Your Slot
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>

                    {/* REVIEWS SECTION */}
                    <section id="reviews" className="py-24 px-8 z-10 bg-black/40 backdrop-blur-md border-t border-white/5">
                        <div className="max-w-6xl mx-auto text-center">
                            <h3 className="text-4xl font-black mb-16 glow-text-purple uppercase tracking-widest">Seeker Testimonials</h3>
                            <div className="grid md:grid-cols-3 gap-8">
                                {[
                                    {n: "Aryan M.", t: "Unbelievable accuracy. The logical approach to my chart made so much sense."},
                                    {n: "Priya S.", t: "The remedies provided are simple and effective. Truly 30 years of expertise shows."},
                                    {n: "Kabir", t: "Best consulting experience. No generic talk, only precise facts."}
                                ].map((r, i) => (
                                    <div key={i} className="glass p-8 rounded-[2.5rem] text-left border-white/5 hover:border-brand-purple/40 transition">
                                        <div className="text-brand-accent mb-4">★★★★★</div>
                                        <p className="text-slate-300 italic text-sm mb-6 leading-relaxed">"{r.t}"</p>
                                        <p className="text-white font-bold uppercase text-[10px] tracking-widest">— {r.n}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </>
            ) : (
                <div className="p-10 z-20 max-w-6xl mx-auto w-full">
                    <h2 className="text-3xl font-black mb-10 uppercase tracking-tighter">Admin Dashboard</h2>
                    <div className="glass rounded-[2rem] overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-white/5 text-[10px] uppercase text-slate-400 tracking-widest">
                                <tr><th className="p-6">Client</th><th className="p-6">Date</th><th className="p-6">Contact</th><th className="p-6">TXID</th></tr>
                            </thead>
                            <tbody className="divide-y divide-white/5">
                                {appointments.map(app => (
                                    <tr key={app.id}>
                                        <td className="p-6 text-sm font-bold">{app.email}</td>
                                        <td className="p-6 text-sm">{app.date}</td>
                                        <td className="p-6 text-brand-blue font-bold">+91 {app.phone}</td>
                                        <td className="p-6 text-xs font-mono text-slate-400">{app.txid}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )}

            {isBooking && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl">
                    <div className="glass w-full max-w-md rounded-[3rem] overflow-hidden slide-up border-brand-purple/20">
                        <div className="p-6 border-b border-white/5 flex justify-between items-center bg-black/20">
                            <h2 className="text-xs font-bold uppercase tracking-widest text-brand-purple">Step {step} of 4</h2>
                            <button onClick={() => setIsBooking(false)} className="text-slate-400">✕</button>
                        </div>
                        <div className="p-10">
                            {step === 1 && (
                                <form onSubmit={otpSent ? (e)=>{e.preventDefault(); if(userOtp===generatedOtp)setStep(2); else alert("Wrong OTP");} : handleSendOTP} className="space-y-4">
                                    <input type="email" required placeholder="EMAIL ADDRESS" value={email} onChange={(e)=>setEmail(e.target.value)} className="w-full bg-black/40 border border-white/10 p-5 rounded-2xl outline-none focus:border-brand-purple text-white" disabled={otpSent}/>
                                    {otpSent && <input type="text" maxLength="6" placeholder="ENTER OTP" value={userOtp} onChange={(e)=>setUserOtp(e.target.value)} className="w-full bg-black/40 border border-brand-purple/40 p-5 rounded-2xl text-center text-3xl font-black tracking-widest text-white"/>}
                                    <button className="w-full bg-white text-black font-black py-5 rounded-2xl uppercase tracking-widest text-xs hover:bg-brand-purple hover:text-white transition">
                                        {isSending ? "..." : (otpSent ? "Verify Code" : "Send OTP")}
                                    </button>
                                </form>
                            )}

                            {step === 2 && (
                                <div className="space-y-6 text-center">
                                    <p className="text-[10px] text-brand-purple font-bold uppercase tracking-widest">Fixed slot at 09:30 PM</p>
                                    <input type="date" min={new Date().toISOString().split('T')[0]} required value={date} onChange={(e)=>setDate(e.target.value)} className="w-full bg-black/40 border border-white/10 p-5 rounded-2xl text-white outline-none"/>
                                    <button onClick={()=>date ? setStep(3) : alert("Pick a date")} className="w-full bg-white text-black font-black py-5 rounded-2xl">Confirm Schedule</button>
                                </div>
                            )}

                            {step === 3 && (
                                <div className="space-y-6 text-center">
                                    <div className="bg-white p-3 rounded-3xl w-52 h-52 mx-auto overflow-hidden flex items-center justify-center border-4 border-brand-purple shadow-2xl">
                                        <img src="WhatsApp Image 2026-04-20 at 3.01.01 PM.jpeg" alt="QR Code" className="max-w-full max-h-full" />
                                    </div>
                                    <p className="text-[10px] text-slate-400 font-bold tracking-widest">UPI ID: bafna4955@okaxis</p>
                                    <input type="text" placeholder="TXID (TRANSACTION ID)" value={txid} onChange={(e)=>setTxid(e.target.value)} className="w-full bg-black/40 border border-white/10 p-4 rounded-2xl text-xs outline-none focus:border-brand-purple text-white"/>
                                    <div className="relative overflow-hidden">
                                        <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => {setFileName(e.target.files[0].name); setHasFile(true);}} />
                                        <div className="file-upload-btn text-[10px] text-slate-400">{fileName}</div>
                                    </div>
                                    <button disabled={!txid || !hasFile} onClick={()=>setStep(4)} className={`w-full font-black py-5 rounded-2xl uppercase text-xs tracking-widest ${(!txid || !hasFile) ? 'bg-slate-800 text-slate-500' : 'bg-brand-purple text-white shadow-purple-500/20 shadow-xl'}`}>Next</button>
                                </div>
                            )}

                            {step === 4 && (
                                <div className="space-y-6 text-center">
                                    <h3 className="text-xl font-black uppercase text-white">Call Details</h3>
                                    <div className="flex shadow-2xl">
                                        <span className="bg-white/10 p-5 rounded-l-2xl text-slate-400 font-bold border border-white/5">+91</span>
                                        <input type="tel" maxLength="10" placeholder="0000000000" value={phone} onChange={(e)=>setPhone(e.target.value)} className="w-full bg-black/40 border border-white/10 p-5 rounded-r-2xl outline-none font-black text-white text-xl tracking-widest" />
                                    </div>
                                    <button onClick={() => phone.length === 10 ? finalizeBooking() : alert("Enter 10 digits")} className="w-full bg-white text-black font-black py-5 rounded-2xl tracking-widest active:scale-95 transition">Finish Booking</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
