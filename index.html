<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Veda - Starlight Edition</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                brand: {
                    bg: '#020420', // Deep midnight blue
                    card: 'rgba(10, 15, 40, 0.7)',
                    border: 'rgba(255, 255, 255, 0.1)',
                    accent: '#7c3aed', // Starlight Purple
                    secondary: '#3b82f6', // Electric Blue
                    muted: '#94a3b8'
                }
            }
        }
    }
}
</script>
<style>
body { background-color: #020420; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; margin: 0; }

/* Starlight Glassmorphism */
.starlight-card {
    background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
}

/* Gradient Text & Glows */
.text-gradient {
    background: linear-gradient(to right, #fff, #7c3aed, #3b82f6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.glow-purple {
    text-shadow: 0 0 20px rgba(124, 58, 237, 0.5), 0 0 40px rgba(124, 58, 237, 0.3);
}

/* Parallax Video Background */
.video-bg-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    overflow: hidden;
}
.video-bg-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.4;
    filter: saturate(1.5) contrast(1.1);
}
.video-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0%, rgba(2, 4, 32, 0.9) 100%);
}

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
.animate-float { animation: float 6s ease-in-out infinite; }

input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, memo } = React;

emailjs.init("8r2tapCdRmVdIbFQb"); 

const Background = memo(() => {
    return (
        <div className="video-bg-container">
            <video autoPlay muted loop playsInline>
                <source src="Untitled design (2).mp4" type="video/mp4" />
            </video>
            <div className="video-overlay"></div>
        </div>
    );
});

function App() {
    const [view, setView] = useState('client');
    const [isBooking, setIsBooking] = useState(false);
    const [step, setStep] = useState(1);
    const [bookedDates, setBookedDates] = useState(['2026-04-25']); 
    const [appointments, setAppointments] = useState([]);

    const [email, setEmail] = useState('');
    const [phone, setPhone] = useState('');
    const [date, setDate] = useState('');
    const [txid, setTxid] = useState('');
    const [otpSent, setOtpSent] = useState(false);
    const [generatedOtp, setGeneratedOtp] = useState('');
    const [userOtp, setUserOtp] = useState('');
    const [isSending, setIsSending] = useState(false);

    const today = new Date().toISOString().split('T')[0];

    const handleSendOTP = async (e) => {
        e.preventDefault();
        if (!email) return;
        setIsSending(true);
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        try {
            await emailjs.send("service_z2jyz5c", "template_hod7wir", { to_email: email, otp_code: code });
            setOtpSent(true);
        } catch (err) { alert("Error sending OTP."); }
        setIsSending(false);
    };

    const finalizeBooking = () => {
        const newApp = { id: 'AV-' + Math.floor(1000+Math.random()*9000), email, phone, date, status: 'Pending', txid };
        setAppointments([newApp, ...appointments]);
        alert("Wait for the approval from the Astro Veda");
        setIsBooking(false); setStep(1);
    };

    return (
        <div className="min-h-screen flex flex-col">
            <Background />
            
            {/* Header */}
            <nav className="flex justify-between items-center p-8 max-w-7xl mx-auto w-full z-20 relative">
                <div className="flex items-center gap-4 cursor-pointer select-none" onDoubleClick={() => setView('admin')} onClick={() => setView('client')}>
                    <span className="text-3xl font-extrabold tracking-tighter text-white">ASTRO<span className="text-brand-accent">VEDA</span></span>
                </div>
                <div className="hidden md:flex gap-8 text-xs font-bold uppercase tracking-widest text-brand-muted">
                    <a href="#reviews" className="hover:text-white transition-colors">Testimonials</a>
                    <button onClick={() => setIsBooking(true)} className="px-6 py-2 bg-brand-accent rounded-full text-white hover:scale-105 transition-all">Book Now</button>
                </div>
            </nav>

            <main className="flex-grow flex flex-col items-center justify-center px-6 py-20 text-center z-10 relative">
                <div className="slide-up">
                    <div className="inline-block px-4 py-1 mb-8 rounded-full bg-brand-accent/20 border border-brand-accent/30 text-brand-accent text-[10px] font-bold uppercase tracking-widest">
                        ✨ Guided by 30 Years of Wisdom
                    </div>
                    
                    <h1 className="text-6xl md:text-[9rem] font-black tracking-tighter mb-4 leading-none uppercase text-white">
                        <span className="text-gradient glow-purple">PRECISION</span><br/>ASTROLOGY
                    </h1>
                    
                    <p className="text-slate-400 text-lg max-w-2xl mx-auto mb-16 font-medium leading-relaxed">
                        Navigate your destiny with unique analysis methods. <br/>
                        Daily exclusive consultation sessions at 09:30 PM.
                    </p>

                    <div className="max-w-sm mx-auto animate-float">
                        <div className="starlight-card p-10 rounded-[3rem] shadow-2xl relative overflow-hidden group">
                            <div className="absolute inset-0 bg-gradient-to-b from-brand-accent/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                            <p className="text-brand-muted line-through font-bold text-sm mb-1 opacity-60">₹3,500</p>
                            <h2 className="text-7xl font-black text-white mb-8 tracking-tighter">₹1,999</h2>
                            <button onClick={() => setIsBooking(true)} className="w-full bg-gradient-to-r from-brand-accent to-brand-secondary text-white font-bold py-5 rounded-2xl hover:brightness-125 transition-all shadow-xl uppercase tracking-widest text-xs">
                                Reserve Your Session
                            </button>
                        </div>
                    </div>
                </div>
            </main>

            {/* Booking Modal */}
            {isBooking && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
                    <div className="starlight-card w-full max-w-md rounded-[2.5rem] overflow-hidden slide-up">
                        <div className="p-6 border-b border-brand-border flex justify-between items-center">
                            <h2 className="text-sm font-bold uppercase tracking-widest text-brand-accent">Step {step} of 4</h2>
                            <button onClick={() => setIsBooking(false)} className="text-white">✕</button>
                        </div>
                        <div className="p-8">
                            {step === 1 && (
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    if(otpSent) { if(userOtp === generatedOtp) setStep(2); else alert("Wrong OTP"); } 
                                    else { handleSendOTP(e); }
                                }} className="space-y-4">
                                    <input type="email" required placeholder="Email Address" value={email} onChange={(e)=>setEmail(e.target.value)} className="w-full bg-slate-900/50 border border-brand-border p-5 rounded-2xl outline-none focus:border-brand-accent text-white" disabled={otpSent} />
                                    {otpSent && <input type="text" maxLength="6" placeholder="Verification Code" value={userOtp} onChange={(e)=>setUserOtp(e.target.value)} className="w-full bg-slate-900/50 border border-brand-border p-5 rounded-2xl text-center text-2xl font-bold tracking-[0.4em] text-brand-accent"/>}
                                    <button type="submit" className="w-full bg-brand-accent text-white font-bold py-4 rounded-2xl uppercase tracking-widest">{otpSent ? "Verify" : "Send OTP"}</button>
                                </form>
                            )}
                            {/* Steps 2-4 same logic as before but with starlight-card styling */}
                            {step === 2 && (
                                <div className="space-y-6 text-center">
                                    <input type="date" min={today} required value={date} onChange={(e)=>setDate(e.target.value)} className="w-full bg-slate-900/50 border border-brand-border p-5 rounded-2xl text-white outline-none"/>
                                    <button onClick={()=>date ? setStep(3) : alert("Select Date")} className="w-full bg-brand-accent text-white font-bold py-4 rounded-2xl uppercase">Continue</button>
                                </div>
                            )}
                            {step === 3 && (
                                <div className="space-y-5 text-center">
                                    <div className="w-48 h-48 bg-white mx-auto rounded-2xl flex items-center justify-center p-2"><img src="WhatsApp Image 2026-04-20 at 3.01.01 PM.jpeg" alt="QR" className="max-w-full max-h-full"/></div>
                                    <input type="text" placeholder="Transaction ID (TXID)" value={txid} onChange={(e)=>setTxid(e.target.value)} className="w-full bg-slate-900/50 border border-brand-border p-4 rounded-2xl text-white outline-none"/>
                                    <button onClick={()=>txid ? setStep(4) : alert("Enter TXID")} className="w-full bg-brand-accent text-white font-bold py-4 rounded-2xl uppercase">Confirm Payment</button>
                                </div>
                            )}
                            {step === 4 && (
                                <div className="space-y-5 text-center">
                                    <input type="tel" maxLength="10" placeholder="Mobile Number" value={phone} onChange={(e)=>setPhone(e.target.value)} className="w-full bg-slate-900/50 border border-brand-border p-5 rounded-2xl outline-none font-bold text-white text-center tracking-widest" />
                                    <button onClick={() => finalizeBooking()} className="w-full bg-brand-accent text-white font-bold py-4 rounded-2xl uppercase">Complete</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
