<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Astro Veda - Premium Astrology</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<script>
tailwind.config = {
    darkMode: 'class',
    theme: {
        extend: {
            colors: {
                brand: {
                    bg: '#000000',
                    card: 'rgba(10, 10, 10, 0.8)',
                    border: 'rgba(250, 204, 21, 0.2)',
                    accent: '#facc15',
                    muted: '#a1a1aa'
                }
            }
        }
    }
}
</script>
<style>
body { background-color: #000; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; overflow-x: hidden; margin: 0; }

/* FIX FOR CHOPPY SCROLL: Hardware Accelerated Video */
.video-bg-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none;
    transform: translateZ(0); /* Force GPU rendering */
    will-change: transform;
}
.video-bg-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0.5;
}
.video-overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.85) 100%);
}

/* FONT COLOR & GLOW EFFECTS */
.glow-gold {
    color: #facc15;
    text-shadow: 0 0 15px rgba(250, 204, 21, 0.6), 0 0 30px rgba(250, 204, 21, 0.3);
}
.glow-white {
    color: #ffffff;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
}

/* SMOOTH REVEAL */
.reveal {
    animation: fadeInUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); filter: blur(5px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

.glass {
    background: rgba(15, 15, 15, 0.7);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(250, 204, 21, 0.15);
}

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-thumb { background: #facc15; border-radius: 10px; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, memo } = React;
emailjs.init("8r2tapCdRmVdIbFQb"); 

// Background component that doesn't re-render on state changes
const MotionBackground = memo(({ scrollY }) => {
    return (
        <div className="video-bg-container" style={{ transform: `scale(${1 + scrollY * 0.0001})` }}>
            <video autoPlay muted loop playsInline>
                <source src="Untitled design (2).mp4" type="video/mp4" />
            </video>
            <div className="video-overlay"></div>
        </div>
    );
});

function App() {
    const [view, setView] = useState('client');
    const [isBooking, setIsBooking] = useState(false);
    const [step, setStep] = useState(1);
    const [scrollY, setScrollY] = useState(0);

    // Form States
    const [email, setEmail] = useState('');
    const [phone, setPhone] = useState('');
    const [date, setDate] = useState('');
    const [txid, setTxid] = useState('');
    const [otpSent, setOtpSent] = useState(false);
    const [userOtp, setUserOtp] = useState('');
    const [generatedOtp, setGeneratedOtp] = useState('');
    const [isSending, setIsSending] = useState(false);
    const [bookedDates, setBookedDates] = useState(['2026-04-25']);
    const [appointments, setAppointments] = useState([]);

    // High-performance scroll listener
    useEffect(() => {
        const onScroll = () => setScrollY(window.pageYOffset);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
    }, []);

    const handleSendOTP = async (e) => {
        e.preventDefault();
        setIsSending(true);
        const code = Math.floor(100000 + Math.random() * 900000).toString();
        setGeneratedOtp(code);
        try {
            await emailjs.send("service_z2jyz5c", "template_hod7wir", { to_email: email, otp_code: code });
            setOtpSent(true);
        } catch (err) { alert("Verification failed."); }
        setIsSending(false);
    };

    const finalizeBooking = () => {
        const newApp = { id: 'AV-' + Date.now().toString().slice(-4), email, phone, date, txid, status: 'Pending' };
        setAppointments([newApp, ...appointments]);
        alert("Wait for the approval from the Astro Veda");
        setIsBooking(false); setStep(1);
    };

    return (
        <div className="min-h-screen flex flex-col">
            <MotionBackground scrollY={scrollY} />
            
            <nav className="flex justify-between items-center p-8 max-w-7xl mx-auto w-full z-20 relative">
                <div className="cursor-pointer select-none" onDoubleClick={() => setView('admin')} onClick={() => setView('client')}>
                    <span className="text-3xl font-black glow-gold uppercase tracking-tighter">ASTROVEDA</span>
                </div>
                <button onClick={() => setIsBooking(true)} className="px-6 py-2 bg-brand-accent text-black font-black rounded-full text-[10px] uppercase tracking-widest hover:scale-105 transition-all">Book Now</button>
            </nav>

            {view === 'client' ? (
                <>
                    <main className="flex-grow flex flex-col items-center justify-center px-6 py-20 text-center z-10 relative">
                        <div className="reveal">
                            <h1 className="text-6xl md:text-[9rem] font-black tracking-tighter mb-4 leading-none uppercase">
                                <span className="glow-white">PRECISION</span><br/>
                                <span className="glow-gold italic">ASTROLOGY</span>
                            </h1>
                            
                            <p className="text-slate-300 text-lg max-w-xl mx-auto mb-16 font-medium leading-relaxed">
                                Elite cosmic analysis using unique Vedic methods. <br/>
                                <span className="text-brand-accent">Exclusive Session: 09:30 PM Daily</span>
                            </p>

                            <div className="max-w-sm mx-auto">
                                <div className="glass p-12 rounded-[3.5rem] relative overflow-hidden group">
                                    <p className="text-slate-500 line-through font-bold text-sm mb-1">₹3,500</p>
                                    <h2 className="text-7xl font-bold text-white mb-8 tracking-tighter">₹1,999</h2>
                                    <button onClick={() => setIsBooking(true)} className="w-full bg-white text-black font-black py-5 rounded-2xl hover:bg-brand-accent transition-all shadow-xl uppercase text-[10px] tracking-widest">
                                        Reserve Your Slot
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>

                    <section id="reviews" className="py-32 px-10 z-10 border-t border-white/5 bg-black/40 backdrop-blur-sm">
                        <div className="max-w-6xl mx-auto text-center">
                            <h3 className="text-3xl font-black mb-20 glow-gold uppercase tracking-widest">Seeker Reviews</h3>
                            <div className="grid md:grid-cols-3 gap-8">
                                {[
                                    {n: "Aryan M.", t: "The session was shockingly accurate and actually logic-based."},
                                    {n: "Priya S.", t: "30 years of expertise shows in the remedies. They are simple and effective."},
                                    {n: "Kabir", t: "The 9:30 PM slot is perfect. Very professional service."}
                                ].map((r, i) => (
                                    <div key={i} className="glass p-10 rounded-[3rem] text-left border-white/5">
                                        <p className="text-slate-300 italic text-sm mb-6 leading-relaxed">"{r.t}"</p>
                                        <p className="text-brand-accent font-black uppercase text-[10px] tracking-widest">— {r.n}</p>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </section>
                </>
            ) : (
                <div className="p-10 z-20 max-w-6xl mx-auto w-full">
                    <div className="flex justify-between items-center mb-10">
                        <h2 className="text-3xl font-black uppercase glow-gold">Admin Panel</h2>
                        <button onClick={()=>setIsAdminLoggedIn(false)} className="px-6 py-2 bg-brand-accent text-black rounded-xl font-bold uppercase text-[10px]">Logout</button>
                    </div>
                    <div className="glass rounded-[3rem] overflow-hidden">
                        <table className="w-full text-left">
                            <thead className="bg-white/5 text-[10px] uppercase text-slate-500 tracking-widest">
                                <tr><th className="p-8">Client</th><th className="p-8">Date</th><th className="p-8">Phone</th><th className="p-8">Status</th></tr>
                            </thead>
                            <tbody className="divide-y divide-white/5 text-sm">
                                {appointments.map(app => (
                                    <tr key={app.id}>
                                        <td className="p-8 font-bold">{app.email}</td>
                                        <td className="p-8">{app.date}</td>
                                        <td className="p-8 text-brand-accent">+91 {app.phone}</td>
                                        <td className="p-8"><span className="text-yellow-500 font-black uppercase text-[10px]">Pending</span></td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div>
            )}

            {isBooking && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-xl">
                    <div className="glass w-full max-w-md rounded-[3rem] overflow-hidden slide-up">
                        <div className="p-6 border-b border-white/5 flex justify-between items-center">
                            <h2 className="text-xs font-bold uppercase tracking-widest text-brand-accent">Step {step} of 4</h2>
                            <button onClick={() => setIsBooking(false)} className="text-white text-xl">✕</button>
                        </div>
                        <div className="p-10">
                            {step === 1 && (
                                <form onSubmit={(e) => { e.preventDefault(); if(otpSent && userOtp===generatedOtp) setStep(2); else if(!otpSent) handleSendOTP(e); else alert("Wrong OTP"); }} className="space-y-4">
                                    <input type="email" required placeholder="EMAIL ADDRESS" value={email} onChange={(e)=>setEmail(e.target.value)} className="w-full bg-black/40 border border-white/10 p-5 rounded-2xl outline-none focus:border-brand-accent text-white font-semibold" disabled={otpSent}/>
                                    {otpSent && <input type="text" maxLength="6" placeholder="ENTER OTP" value={userOtp} onChange={(e)=>setUserOtp(e.target.value)} className="w-full bg-black border border-brand-accent/30 p-5 rounded-2xl text-center text-2xl font-black tracking-widest text-brand-accent"/>}
                                    <button type="submit" className="w-full bg-white text-black font-black py-5 rounded-2xl uppercase tracking-widest text-xs hover:bg-brand-accent">
                                        {isSending ? "..." : (otpSent ? "Verify" : "Send OTP")}
                                    </button>
                                </form>
                            )}
                            {step === 2 && (
                                <div className="space-y-6 text-center">
                                    <p className="text-[10px] text-brand-accent font-bold uppercase">Time Slot: 09:30 PM</p>
                                    <input type="date" min={today} required value={date} onChange={(e)=>setDate(e.target.value)} className="w-full bg-black/40 border border-white/10 p-5 rounded-2xl text-white outline-none"/>
                                    <button onClick={()=>date ? setStep(3) : alert("Pick date")} className="w-full bg-white text-black font-black py-5 rounded-2xl uppercase text-xs">Continue</button>
                                </div>
                            )}
                            {step === 3 && (
                                <div className="space-y-6 text-center">
                                    <div className="bg-white p-3 rounded-3xl w-52 h-52 mx-auto flex items-center justify-center border-4 border-brand-accent shadow-xl">
                                        <img src="WhatsApp Image 2026-04-20 at 3.01.01 PM.jpeg" alt="QR" className="max-w-full max-h-full" />
                                    </div>
                                    <p className="text-[10px] text-slate-400 font-bold tracking-widest uppercase">UPI: bafna4955@okaxis</p>
                                    <input type="text" placeholder="TXID" value={txid} onChange={(e)=>setTxid(e.target.value)} className="w-full bg-black/40 border border-white/10 p-4 rounded-2xl text-xs outline-none focus:border-brand-accent text-white font-bold"/>
                                    <button onClick={()=>txid ? setStep(4) : alert("Enter TXID")} className="w-full bg-brand-accent text-black font-black py-5 rounded-2xl uppercase text-xs">Verify Payment</button>
                                </div>
                            )}
                            {step === 4 && (
                                <div className="space-y-6 text-center">
                                    <h3 className="text-xl font-black uppercase text-white">Call Details</h3>
                                    <div className="flex shadow-2xl">
                                        <span className="bg-white/10 p-5 rounded-l-2xl text-slate-400 font-bold">+91</span>
                                        <input type="tel" maxLength="10" placeholder="0000000000" value={phone} onChange={(e)=>setPhone(e.target.value)} className="w-full bg-black border border-brand-border p-5 rounded-r-2xl outline-none font-black text-white text-xl tracking-widest" />
                                    </div>
                                    <button onClick={() => finalizeBooking()} className="w-full bg-white text-black font-black py-5 rounded-2xl tracking-widest active:scale-95 transition">Finish Booking</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
